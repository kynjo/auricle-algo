name: Validate distribution

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      AURICLE_RELEASE: ${{ inputs.release && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate source, assets and version
        run: |
          python packaging/validate_distribution.py
          python packaging/release_metadata.py
          python auricle_gui.py --smoke-test
      - name: Build wheel and source tarball
        run: python -m build
      - name: Start installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/auricle-wheel-check"
          "$RUNNER_TEMP/auricle-wheel-check/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/auricle-wheel-check/bin/auricle" --smoke-test
      - name: Package clean sources and stage Python distributions
        run: python packaging/source_archive.py --python-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: source-distributions
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          compression-level: 0

name: release

# Builds Auricle for Windows, Linux and macOS (Apple Silicon + Intel).
#  - push a tag such as v110       -> builds all platforms and publishes a GitHub Release
#  - Actions > release > Run workflow -> builds all platforms, files stay in the run's artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04,   name: linux-x64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --clean Auricle.spec

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/Auricle -DestinationPath "out/Auricle-${{ matrix.name }}.zip"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          bash packaging/make_appimage.sh

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R dist/Auricle.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Auricle -srcfolder dmg -ov -format UDZO "out/Auricle-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Auricle-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

name: Build and release Auricle

# Both Run workflow and a version tag publish the complete release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auricle-release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  build:
    name: Build ${{ matrix.target }}
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: windows-x64, python_arch: x64}
          - {os: ubuntu-22.04, target: linux-x64, python_arch: x64}
          - {os: macos-15, target: macos-arm64, python_arch: arm64}
          - {os: macos-15-intel, target: macos-x64, python_arch: x64}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Freeze native application
        run: python -m PyInstaller --noconfirm --clean Auricle.spec
      - name: Verify native startup outside checkout
        run: python packaging/smoke_native.py
      - name: Package native application
        run: python packaging/package_release.py ${{ matrix.target }}
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python packaging/fetch_appimage_tools.py
          APPIMAGETOOL="$PWD/build/appimage/appimagetool" bash packaging/make_appimage.sh
          appimage=$(find out -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          if [ -z "$appimage" ]; then echo "Missing AppImage" >&2; exit 1; fi
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
          compression-level: 0

  release:
    name: Publish complete release
    needs: [check, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: source-distributions
          path: out
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: out
          merge-multiple: true
      - name: Verify all artifacts and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python packaging/release_metadata.py
          python packaging/checksums.py out
          python packaging/publish_release.py

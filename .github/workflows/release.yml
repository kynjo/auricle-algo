name: Release

# A manual run builds artifacts; a matching version tag also publishes a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1 libegl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean Auricle.spec
      - name: Check native startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/Auricle/Auricle.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Auricle smoke test failed ($($p.ExitCode))" }
      - name: Check native startup (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Auricle/Auricle --smoke-test
      - name: Check native startup (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/Auricle.app/Contents/MacOS/Auricle --smoke-test
      - name: Package Windows or macOS
        if: runner.os != 'Linux'
        run: python packaging/package_release.py ${{ matrix.name }}
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          bash packaging/make_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Auricle-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: Auricle-*
          path: out
          merge-multiple: true
      - name: Release description and checksums
        run: |
          python packaging/release_metadata.py
          python packaging/checksums.py out
      - uses: softprops/action-gh-release@v3
        with:
          body_path: build/release-notes.md
          files: out/*
          fail_on_unmatched_files: true
